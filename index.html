<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>hAI.FHEMChatAgent</title>
<style>body{margin:0;background:#0b1020;color:#f0f5ff;font:16px/1.5 system-ui}main{max-width:980px;margin:auto;padding:20px}section{background:#151d33;border:1px solid #344568;border-radius:18px;padding:18px;margin:16px 0}h1{color:#78e8cc}input,textarea,button,select{font:inherit;border-radius:9px;padding:10px;margin:5px 0;max-width:100%;box-sizing:border-box}textarea,input{width:100%;background:#0e172a;color:white;border:1px solid #8299ff}button{background:#78e8cc;color:#102334;border:0;cursor:pointer}button:disabled{opacity:.5}pre,.msg{white-space:pre-wrap;overflow-wrap:anywhere}.msg{padding:12px;background:#24314d;border-radius:12px;margin:10px 0}.user{background:#284c60}.device{display:block;text-align:left;width:100%}#error,#recovery{color:#ffbc78}#approval{border:2px solid #ffbc78}#log{max-height:55vh;overflow:auto}</style>
<main><h1>hAI.FHEMChatAgent</h1>
<section><div id="log" aria-live="polite"></div><p id="recovery" role="status" hidden></p><div id="approval" hidden><h2>Auftrag einzeln freigeben</h2><pre id="proposal"></pre><p id="expires"></p><button id="yes">Genau so ausführen</button> <button id="no">Abbrechen</button></div><p id="error" role="alert"></p><form id="chat"><label for="text">Deine Nachricht</label><textarea id="text" required maxlength="8000" placeholder="Welche Heizungen gibt es im Wohnzimmer?"></textarea><button id="send">Senden</button></form><button id="reset">Neuer Chat</button></section>
<section><h2>Geräte finden</h2><form id="search"><label for="query">Raum, Alias, Name oder Gerätetyp</label><input id="query" maxlength="120"><button>Suchen</button></form><label for="template">Abfrage für ausgewähltes Gerät</label><select id="template"></select><p id="count"></p><div id="results"></div><small>Auswahl bereitet nur eine Nachricht vor. Du sendest sie selbst.</small></section>
<section><h2>Verbindungen</h2><button id="check">Jetzt prüfen</button><pre id="diagnostics">Noch nicht geprüft.</pre></section></main>
<script>
const $=id=>document.getElementById(id);let pending=null,busy=false,templates=[],expiryTimer=null;
function detail(d){if(typeof d==='string')return d;if(d&&typeof d==='object'&&!Array.isArray(d))return [d.message,d.phase&&'phase: '+d.phase,d.code&&'code: '+d.code].filter(Boolean).join(' · ')||JSON.stringify(d);return JSON.stringify(d)||'Anfrage fehlgeschlagen'}
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-FHEM-Chat':'1'},body:JSON.stringify(data)});const s=await r.json();if(!r.ok)throw Error(detail(s.detail));return s}
function controls(){for(const id of ['send','yes','no','reset'])$(id).disabled=busy;$('send').disabled=busy||!!pending;const expired=pending&&pending.expires*1000<=Date.now();$('yes').disabled=busy||!pending||expired;$('no').disabled=busy||!pending||expired}
async function refreshExpired(){if(!pending)return;if(busy){expiryTimer=setTimeout(refreshExpired,1000);return}await action('/api/state')}
function render(s){clearTimeout(expiryTimer);$('log').replaceChildren();for(const m of s.messages){if(!m.content)continue;const a=document.createElement(m.role==='tool'?'details':'article');if(m.role==='tool'){const title=document.createElement('summary');title.textContent='Werkzeugantwort';const pre=document.createElement('pre');pre.textContent=m.content;a.append(title,pre)}else{a.className='msg '+m.role;a.textContent=(m.role==='user'?'Du: ':'Assistent: ')+m.content}$('log').append(a)}pending=s.pending;$('approval').hidden=!pending;if(pending){$('proposal').textContent=JSON.stringify(pending.action,null,2);$('expires').textContent='Gültig bis '+new Date(pending.expires*1000).toLocaleTimeString();expiryTimer=setTimeout(refreshExpired,Math.max(100,pending.expires*1000-Date.now()+100))}$('recovery').hidden=!s.recovery;$('recovery').textContent=s.recovery?'Schreibsperre: '+s.recovery.reason+' Lesen bleibt möglich. Nach Statusprüfung: /weiter <neuer Auftrag>. Neuer Chat hebt diese Sperre nicht auf.':'';controls();$('log').scrollTop=$('log').scrollHeight}
async function action(path,data){if(busy)return;busy=true;controls();$('error').textContent='';try{render(await api(path,data));return true}catch(e){$('error').textContent=e.message;if(path==='/api/state'&&pending)expiryTimer=setTimeout(refreshExpired,5000)}finally{busy=false;controls()}}
$('chat').onsubmit=async e=>{e.preventDefault();if(pending)return;if(await action('/api/chat',{text:$('text').value}))$('text').value=''};
$('yes').onclick=()=>pending&&action('/api/decision',{id:pending.id,approve:true});$('no').onclick=()=>pending&&action('/api/decision',{id:pending.id,approve:false});$('reset').onclick=()=>confirm('Verlauf und offene Freigabe verwerfen? Eine Recovery-Sperre bleibt bestehen.')&&action('/api/reset',{});
$('search').onsubmit=async e=>{e.preventDefault();$('results').replaceChildren();$('count').textContent='Suche …';try{const s=await api('/api/devices?q='+encodeURIComponent($('query').value));$('count').textContent=s.total+' Treffer; maximal 30 angezeigt.';for(const d of s.devices){const b=document.createElement('button');b.className='device';b.textContent=d.alias+' · '+d.name+' · '+(d.room||'ohne Raum');b.onclick=()=>{const t=templates.find(t=>t.id===$('template').value);if(t){$('text').value=t.text.replace('{device}',JSON.stringify(d.name));$('text').focus()}};$('results').append(b)}}catch(e){$('count').textContent=e.message}};
$('check').onclick=async()=>{$('check').disabled=true;try{$('diagnostics').textContent=JSON.stringify(await api('/api/diagnostics',{}),null,2)}catch(e){$('diagnostics').textContent=e.message}finally{$('check').disabled=false}};
(async()=>{try{render(await api('/api/state'));templates=(await api('/api/menu')).templates.filter(t=>t.id!=='devices');for(const t of templates){const o=document.createElement('option');o.value=t.id;o.textContent=t.label;$('template').append(o)}}catch(e){$('error').textContent=e.message}})();
</script></html>
